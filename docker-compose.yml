version: '3.8'

services:
  fantasy-calc-scrape:
    build: .
    container_name: fantasy-calc-scrape
    ports:
      - "5146:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # BetterStack Logging
      - BetterStack__SourceToken=${BETTERSTACK_SOURCE_TOKEN}
      - BetterStack__Endpoint=${BETTERSTACK_ENDPOINT}
      # Supabase Configuration
      - Supabase__Url=${SUPABASE_URL}
      - Supabase__Key=${SUPABASE_KEY}
      - Supabase__ServiceRoleKey=${SUPABASE_SERVICE_ROLE_KEY}
      - Supabase__ProjectId=${SUPABASE_PROJECT_ID}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
